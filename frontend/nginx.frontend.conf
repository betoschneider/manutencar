server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Importante para que o navegador reconheça arquivos .js e .css
    include /etc/nginx/mime.types;

    # ===== Headers de Segurança =====
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o Backend (chamadas de API)
    # A barra final aqui é crucial: /api/ -> / no backend
    location /api/ {
        proxy_pass http://backend:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Impede que erros da API caiam no fallback do index.html
        proxy_intercept_errors off;
    }

    # Opcional: lidar com chamadas sem a barra final /api -> /api/
    location = /api {
        return 301 $scheme://$http_host$uri/;
    }

    # Arquivos JS (exceto da API) agora têm Cache Busting no HTML, mas vamos manter um cache curto
    location ~* ^(?!\/api\/).*\.js$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
